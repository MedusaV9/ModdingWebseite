<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="mm-affe" data-affe="pumper-paule" role="img" aria-label="Pumper-Paule">
  <title>Pumper-Paule — der Gym-Gorilla (breiteste Silhouette)</title>
  <style>
    svg[data-affe="pumper-paule"] .fell{fill:var(--fell,#7A4E2D)}
    svg[data-affe="pumper-paule"] .fell-hell{fill:var(--fell-hell,#C99B71)}
    svg[data-affe="pumper-paule"] .fell-s{stroke:var(--fell,#7A4E2D);fill:none}
    svg[data-affe="pumper-paule"] .o{stroke:#1A1208;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    svg[data-affe="pumper-paule"] .os{stroke:#1A1208;fill:none;stroke-linecap:round}
    svg[data-affe="pumper-paule"] #kopf,svg[data-affe="pumper-paule"] #arm-l,svg[data-affe="pumper-paule"] #arm-r,svg[data-affe="pumper-paule"] #bein-l,svg[data-affe="pumper-paule"] #bein-r,svg[data-affe="pumper-paule"] #schwanz{transform-box:view-box}
    svg[data-affe="pumper-paule"] #kopf{transform-origin:120px 118px}
    svg[data-affe="pumper-paule"] #arm-l{transform-origin:64px 130px}
    svg[data-affe="pumper-paule"] #arm-r{transform-origin:176px 130px}
    svg[data-affe="pumper-paule"] #bein-l{transform-origin:104px 250px}
    svg[data-affe="pumper-paule"] #bein-r{transform-origin:136px 250px}
    svg[data-affe="pumper-paule"] #schwanz{transform-origin:144px 250px}
    svg[data-affe="pumper-paule"] .gesicht{display:none}
    svg[data-affe="pumper-paule"] #gesicht-neutral{display:inline}
    svg[data-affe="pumper-paule"][data-gesicht=jubel] #gesicht-neutral,svg[data-affe="pumper-paule"][data-gesicht=frust] #gesicht-neutral,svg[data-affe="pumper-paule"][data-gesicht=denk] #gesicht-neutral{display:none}
    svg[data-affe="pumper-paule"][data-gesicht=jubel] #gesicht-jubel{display:inline}
    svg[data-affe="pumper-paule"][data-gesicht=frust] #gesicht-frust{display:inline}
    svg[data-affe="pumper-paule"][data-gesicht=denk] #gesicht-denk{display:inline}
  </style>

  <g id="schwanz">
    <path class="os" d="M 142 252 C 186 262 206 232 184 220 C 168 212 160 228 174 232" stroke-width="16"/>
    <path class="fell-s" d="M 142 252 C 186 262 206 232 184 220 C 168 212 160 228 174 232" stroke-width="9"/>
  </g>

  <g id="bein-l">
    <path class="os" d="M 104 250 C 100 268 98 282 96 294" stroke-width="24"/>
    <path class="fell-s" d="M 104 250 C 100 268 98 282 96 294" stroke-width="16"/>
    <ellipse class="fell o" cx="90" cy="302" rx="19" ry="9.5"/>
  </g>
  <g id="bein-r">
    <path class="os" d="M 136 250 C 140 268 142 282 144 294" stroke-width="24"/>
    <path class="fell-s" d="M 136 250 C 140 268 142 282 144 294" stroke-width="16"/>
    <ellipse class="fell o" cx="150" cy="302" rx="19" ry="9.5"/>
  </g>

  <g id="koerper">
    <!-- Massives V-Profil im Tanktop -->
    <path class="o" d="M 44 116 C 40 138 52 152 68 156 C 74 200 90 236 104 252 L 136 252 C 150 236 166 200 172 156 C 188 152 200 138 196 116 C 170 96 70 96 44 116 Z" fill="#3B82F6"/>
    <!-- Tanktop-Träger-Ausschnitt: Brustfell -->
    <path class="fell o" d="M 96 108 C 104 124 136 124 144 108 C 138 132 102 132 96 108 Z" stroke-width="4"/>
    <!-- Brust-Definition -->
    <path class="os" d="M 96 160 C 108 168 132 168 144 160" stroke-width="4"/>
    <path class="os" d="M 120 168 L 120 196" stroke-width="4"/>
    <!-- Hantel-Print -->
    <g stroke="#FFF6E3" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="104" y1="210" x2="136" y2="210"/>
      <rect x="96" y="203" width="7" height="14" rx="2" fill="#FFF6E3" stroke="none"/>
      <rect x="137" y="203" width="7" height="14" rx="2" fill="#FFF6E3" stroke="none"/>
    </g>
  </g>

  <g id="arm-l">
    <!-- Riesen-Arm -->
    <path class="os" d="M 64 130 C 46 152 40 180 46 206" stroke-width="34"/>
    <path class="fell-s" d="M 64 130 C 46 152 40 180 46 206" stroke-width="25"/>
    <circle class="fell o" cx="48" cy="218" r="15"/>
    <!-- Bizeps-Glanz -->
    <path class="os" d="M 50 148 C 44 160 42 172 44 184" stroke="#C99B71" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="arm-r">
    <path class="os" d="M 176 130 C 194 152 200 180 194 206" stroke-width="34"/>
    <path class="fell-s" d="M 176 130 C 194 152 200 180 194 206" stroke-width="25"/>
    <circle class="fell o" cx="192" cy="218" r="15"/>
    <!-- Protein-Shaker -->
    <g id="prop-shaker" transform="rotate(6 206 236)">
      <path d="M 196 226 L 216 226 L 212 262 L 200 262 Z" fill="#8FE04B" stroke="#1A1208" stroke-width="4.5" stroke-linejoin="round"/>
      <rect x="197" y="218" width="18" height="10" rx="3" fill="#FFF6E3" stroke="#1A1208" stroke-width="4"/>
      <circle cx="206" cy="215" r="3.5" fill="#FFF6E3" stroke="#1A1208" stroke-width="3"/>
      <path d="M 199 240 L 213 240" stroke="#1A1208" stroke-width="2.5"/>
      <path d="M 200 250 L 212 250" stroke="#1A1208" stroke-width="2.5"/>
    </g>
  </g>

  <g id="kopf">
    <!-- Winziger Kopf auf Riesen-Körper -->
    <circle class="fell o" cx="120" cy="74" r="30"/>
    <circle class="fell o" cx="89" cy="70" r="9"/>
    <circle class="fell o" cx="151" cy="70" r="9"/>
    <circle class="fell-hell" cx="89" cy="70" r="4"/>
    <circle class="fell-hell" cx="151" cy="70" r="4"/>
    <ellipse class="fell-hell o" cx="120" cy="84" rx="19" ry="14" stroke-width="4"/>

    <g id="gesicht-neutral" class="gesicht">
      <circle cx="110" cy="66" r="5" fill="#FFF6E3"/>
      <circle cx="130" cy="66" r="5" fill="#FFF6E3"/>
      <circle cx="111" cy="67" r="2.4" fill="#1A1208"/>
      <circle cx="129" cy="67" r="2.4" fill="#1A1208"/>
      <path class="os" d="M 103 58 L 116 57" stroke-width="3.5"/>
      <path class="os" d="M 124 57 L 137 58" stroke-width="3.5"/>
      <circle cx="115" cy="80" r="1.6" fill="#1A1208"/>
      <circle cx="125" cy="80" r="1.6" fill="#1A1208"/>
      <path class="os" d="M 112 90 Q 120 94 128 90" stroke-width="3.5"/>
    </g>
    <g id="gesicht-jubel" class="gesicht">
      <path class="os" d="M 104 66 Q 110 60 116 66" stroke-width="4"/>
      <path class="os" d="M 124 66 Q 130 60 136 66" stroke-width="4"/>
      <circle cx="115" cy="78" r="1.6" fill="#1A1208"/>
      <circle cx="125" cy="78" r="1.6" fill="#1A1208"/>
      <path d="M 108 85 Q 120 100 132 85 Q 120 89 108 85 Z" fill="#1A1208"/>
    </g>
    <g id="gesicht-frust" class="gesicht">
      <path class="os" d="M 104 59 L 116 63" stroke-width="4"/>
      <path class="os" d="M 136 59 L 124 63" stroke-width="4"/>
      <circle cx="111" cy="68" r="2.3" fill="#1A1208"/>
      <circle cx="129" cy="68" r="2.3" fill="#1A1208"/>
      <circle cx="115" cy="80" r="1.6" fill="#1A1208"/>
      <circle cx="125" cy="80" r="1.6" fill="#1A1208"/>
      <path class="os" d="M 112 93 Q 120 87 128 93" stroke-width="3.5"/>
    </g>
    <g id="gesicht-denk" class="gesicht">
      <circle cx="110" cy="66" r="5" fill="#FFF6E3"/>
      <circle cx="130" cy="66" r="5" fill="#FFF6E3"/>
      <circle cx="109" cy="64" r="2.3" fill="#1A1208"/>
      <circle cx="129" cy="64" r="2.3" fill="#1A1208"/>
      <path class="os" d="M 102 57 L 115 54" stroke-width="3.5"/>
      <circle cx="115" cy="80" r="1.6" fill="#1A1208"/>
      <circle cx="125" cy="80" r="1.6" fill="#1A1208"/>
      <path class="os" d="M 113 90 Q 117 87 121 90 Q 125 93 127 90" stroke-width="3.5"/>
    </g>

    <!-- Schweißband -->
    <g id="accessoire">
      <path class="o" d="M 92 56 C 100 48 140 48 148 56 L 146 46 C 136 39 104 39 94 46 Z" fill="#F5B301" stroke-width="4"/>
    </g>
  </g>
</svg>
