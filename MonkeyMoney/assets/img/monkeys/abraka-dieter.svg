<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="mm-affe" data-affe="abraka-dieter" role="img" aria-label="Abraka-Dieter">
  <title>Abraka-Dieter  der Zauberer (Spitzhut + Rauschebart + Glockenrobe)</title>
  <style>
    svg[data-affe="abraka-dieter"] .fell{fill:var(--fell,#6E5A7E)}
    svg[data-affe="abraka-dieter"] .fell-hell{fill:var(--fell-hell,#CBB9D9)}
    svg[data-affe="abraka-dieter"] .fell-s{stroke:var(--fell,#6E5A7E);fill:none}
    svg[data-affe="abraka-dieter"] .o{stroke:#1A1208;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    svg[data-affe="abraka-dieter"] .os{stroke:#1A1208;fill:none;stroke-linecap:round}
    svg[data-affe="abraka-dieter"] .robe{fill:var(--prop,#3A3E7C)}
    svg[data-affe="abraka-dieter"] #kopf,svg[data-affe="abraka-dieter"] #arm-l,svg[data-affe="abraka-dieter"] #arm-r,svg[data-affe="abraka-dieter"] #bein-l,svg[data-affe="abraka-dieter"] #bein-r,svg[data-affe="abraka-dieter"] #schwanz,svg[data-affe="abraka-dieter"] #bart{transform-box:view-box}
    svg[data-affe="abraka-dieter"] #kopf{transform-origin:120px 140px}
    svg[data-affe="abraka-dieter"] #arm-l{transform-origin:90px 156px}
    svg[data-affe="abraka-dieter"] #arm-r{transform-origin:150px 156px}
    svg[data-affe="abraka-dieter"] #bein-l{transform-origin:102px 244px}
    svg[data-affe="abraka-dieter"] #bein-r{transform-origin:138px 244px}
    svg[data-affe="abraka-dieter"] #schwanz{transform-origin:146px 244px}
    svg[data-affe="abraka-dieter"] #bart{transform-origin:120px 114px}
    svg[data-affe="abraka-dieter"] .gesicht{display:none}
    svg[data-affe="abraka-dieter"] #gesicht-neutral{display:inline}
    svg[data-affe="abraka-dieter"][data-gesicht=jubel] #gesicht-neutral,svg[data-affe="abraka-dieter"][data-gesicht=frust] #gesicht-neutral,svg[data-affe="abraka-dieter"][data-gesicht=denk] #gesicht-neutral{display:none}
    svg[data-affe="abraka-dieter"][data-gesicht=jubel] #gesicht-jubel{display:inline}
    svg[data-affe="abraka-dieter"][data-gesicht=frust] #gesicht-frust{display:inline}
    svg[data-affe="abraka-dieter"][data-gesicht=denk] #gesicht-denk{display:inline}
  </style>

  <g id="schwanz">
    <path class="os" d="M 144 246 C 190 254 208 220 184 208 C 168 200 160 216 174 220" stroke-width="15"/>
    <path class="fell-s" d="M 144 246 C 190 254 208 220 184 208 C 168 200 160 216 174 220" stroke-width="8.5"/>
  </g>

  <g id="bein-l">
    <path class="os" d="M 102 244 C 98 264 96 280 94 294" stroke-width="18"/>
    <path class="fell-s" d="M 102 244 C 98 264 96 280 94 294" stroke-width="11"/>
    <ellipse class="fell o" cx="89" cy="301" rx="15" ry="8.5"/>
  </g>
  <g id="bein-r">
    <path class="os" d="M 138 244 C 142 264 144 280 146 294" stroke-width="18"/>
    <path class="fell-s" d="M 138 244 C 142 264 144 280 146 294" stroke-width="11"/>
    <ellipse class="fell o" cx="151" cy="301" rx="15" ry="8.5"/>
  </g>

  <g id="koerper">
    <!-- Glockenrobe: einzige nach unten ausgestellte Silhouette -->
    <path class="robe o" d="M 90 150 C 76 184 70 222 66 254 L 174 254 C 170 222 164 184 150 150 C 136 140 102 140 90 150 Z"/>
    <!-- Sterne + Mond -->
    <g fill="#F5B301">
      <path d="M 98 178 L 101 185 L 108 186 L 103 191 L 104 198 L 98 194 L 92 198 L 93 191 L 88 186 L 95 185 Z"/>
      <path d="M 138 206 L 140 211 L 145 212 L 141 215 L 142 220 L 138 217 L 134 220 L 135 215 L 131 212 L 136 211 Z"/>
      <path d="M 112 226 C 108 234 112 242 120 244 C 111 246 103 240 104 231 C 105 226 108 226 112 226 Z"/>
    </g>
    <!-- Kordel-Gürtel mit Quaste -->
    <path class="os" d="M 84 196 C 100 202 140 202 156 196" stroke="#F5B301" stroke-width="4.5"/>
    <path class="os" d="M 152 198 C 154 208 152 216 148 222" stroke="#F5B301" stroke-width="3.5"/>
    <circle cx="147" cy="226" r="4" fill="#F5B301" stroke="#1A1208" stroke-width="2.5"/>
  </g>

  <g id="arm-l">
    <!-- Trompeten-Ärmel -->
    <path class="robe o" d="M 90 156 C 76 174 66 200 58 224 L 92 230 C 92 206 96 180 102 160 Z"/>
    <circle class="fell o" cx="74" cy="238" r="10"/>
  </g>
  <g id="arm-r">
    <!-- Zauberstab hoch: GROSSE Magie angekündigt -->
    <path class="robe o" d="M 150 156 C 162 148 172 136 178 120 L 150 106 C 146 124 142 142 138 158 Z"/>
    <circle class="fell o" cx="176" cy="110" r="10"/>
    <g id="prop-zauberstab">
      <path class="os" d="M 180 104 L 198 82" stroke="#8A6D3B" stroke-width="7"/>
      <path class="os" d="M 180 104 L 198 82" stroke-width="2" opacity="0.5"/>
      <path d="M 203 75 L 206 82 L 213 85 L 206 88 L 203 95 L 200 88 L 193 85 L 200 82 Z" fill="#F5B301" stroke="#1A1208" stroke-width="3"/>
      <g fill="#F5B301" opacity="0.9">
        <circle cx="188" cy="64" r="2.5"/>
        <circle cx="216" cy="70" r="2"/>
        <circle cx="219" cy="98" r="2.5"/>
      </g>
    </g>
  </g>

  <g id="kopf">
    <circle class="fell o" cx="120" cy="92" r="40"/>
    <circle class="fell o" cx="80" cy="86" r="11"/>
    <circle class="fell o" cx="160" cy="86" r="11"/>
    <circle class="fell-hell" cx="80" cy="86" r="5"/>
    <circle class="fell-hell" cx="160" cy="86" r="5"/>
    <ellipse class="fell-hell o" cx="120" cy="102" rx="24" ry="16" stroke-width="4"/>

    <g id="gesicht-neutral" class="gesicht">
      <circle cx="105" cy="82" r="6.5" fill="#FFF6E3"/>
      <circle cx="135" cy="82" r="6.5" fill="#FFF6E3"/>
      <circle cx="106" cy="83" r="3" fill="#1A1208"/>
      <circle cx="134" cy="83" r="3" fill="#1A1208"/>
      <!-- Buschige weiße Brauen -->
      <path d="M 94 74 C 98 68 108 68 112 72 L 110 76 C 106 73 99 73 96 77 Z" fill="#FFF6E3" stroke="#1A1208" stroke-width="2.5"/>
      <path d="M 146 74 C 142 68 132 68 128 72 L 130 76 C 134 73 141 73 144 77 Z" fill="#FFF6E3" stroke="#1A1208" stroke-width="2.5"/>
      <circle cx="113" cy="97" r="1.8" fill="#1A1208"/>
      <circle cx="127" cy="97" r="1.8" fill="#1A1208"/>
      <path class="os" d="M 109 108 Q 120 113 131 108" stroke-width="4"/>
    </g>
    <g id="gesicht-jubel" class="gesicht">
      <path class="os" d="M 98 82 Q 105 74 112 82" stroke-width="4.5"/>
      <path class="os" d="M 128 82 Q 135 74 142 82" stroke-width="4.5"/>
      <circle cx="113" cy="95" r="1.8" fill="#1A1208"/>
      <circle cx="127" cy="95" r="1.8" fill="#1A1208"/>
      <path d="M 106 103 Q 120 118 134 103 Q 120 108 106 103 Z" fill="#1A1208"/>
    </g>
    <g id="gesicht-frust" class="gesicht">
      <path class="os" d="M 97 73 L 113 79" stroke-width="4.5"/>
      <path class="os" d="M 143 73 L 127 79" stroke-width="4.5"/>
      <circle cx="106" cy="85" r="2.9" fill="#1A1208"/>
      <circle cx="134" cy="85" r="2.9" fill="#1A1208"/>
      <circle cx="113" cy="97" r="1.8" fill="#1A1208"/>
      <circle cx="127" cy="97" r="1.8" fill="#1A1208"/>
      <path class="os" d="M 109 111 Q 120 104 131 111" stroke-width="4"/>
    </g>
    <g id="gesicht-denk" class="gesicht">
      <circle cx="105" cy="82" r="6.5" fill="#FFF6E3"/>
      <circle cx="135" cy="82" r="6.5" fill="#FFF6E3"/>
      <circle cx="104" cy="79" r="2.9" fill="#1A1208"/>
      <circle cx="134" cy="79" r="2.9" fill="#1A1208"/>
      <path d="M 94 72 C 98 66 108 66 112 70 L 110 74 C 106 71 99 71 96 75 Z" fill="#FFF6E3" stroke="#1A1208" stroke-width="2.5"/>
      <circle cx="113" cy="97" r="1.8" fill="#1A1208"/>
      <circle cx="127" cy="97" r="1.8" fill="#1A1208"/>
      <path class="os" d="M 110 109 Q 115 105 120 109 Q 125 113 130 109" stroke-width="4"/>
    </g>

    <!-- Rauschebart (Nachschwing-Gelenk, wedelt beim Nicken mit) -->
    <g id="bart">
      <path class="o" d="M 96 112 C 88 138 94 166 120 176 C 146 166 152 138 144 112 C 136 121 104 121 96 112 Z" fill="#FFF6E3"/>
      <path d="M 106 124 C 104 138 106 152 112 162 M 134 124 C 136 138 134 152 128 162 M 120 128 L 120 168" fill="none" stroke="#1A1208" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <!-- Schnauzer über dem Bart-Ansatz -->
      <path class="o" d="M 118 110 C 110 106 100 108 96 114 C 104 118 114 117 118 112 Z" fill="#FFF6E3" stroke-width="3"/>
      <path class="o" d="M 122 110 C 130 106 140 108 144 114 C 136 118 126 117 122 112 Z" fill="#FFF6E3" stroke-width="3"/>
    </g>

    <!-- Schiefer Spitzhut mit Sternen -->
    <g id="accessoire">
      <g id="prop-spitzhut" transform="rotate(-7 120 56)">
        <ellipse class="o" cx="120" cy="58" rx="46" ry="10" fill="#3A3E7C"/>
        <path class="o" d="M 96 54 C 102 34 110 16 136 4 C 130 12 132 20 140 22 C 134 32 138 42 146 54 C 130 62 108 62 96 54 Z" fill="#3A3E7C"/>
        <path d="M 95 46 C 112 54 130 54 147 46 L 147 53 C 130 60 112 60 95 53 Z" fill="#F5B301" stroke="#1A1208" stroke-width="3.5"/>
        <path d="M 116 32 L 118 37 L 123 38 L 119 41 L 120 46 L 116 43 L 112 46 L 113 41 L 109 38 L 114 37 Z" fill="#F5B301"/>
        <circle class="o" cx="138" cy="6" r="5" fill="#F5B301" stroke-width="3"/>
      </g>
    </g>
  </g>
</svg>
