<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="mm-affe" data-affe="glitzer-gina" role="img" aria-label="Glitzer-Gina">
  <title>Glitzer-Gina — die Diva (Federkrone + Boa + Dauer-Pose)</title>
  <style>
    svg[data-affe="glitzer-gina"] .fell{fill:var(--fell,#FFDE6B)}
    svg[data-affe="glitzer-gina"] .fell-hell{fill:var(--fell-hell,#FFF3C4)}
    svg[data-affe="glitzer-gina"] .fell-s{stroke:var(--fell,#FFDE6B);fill:none}
    svg[data-affe="glitzer-gina"] .o{stroke:#1A1208;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    svg[data-affe="glitzer-gina"] .os{stroke:#1A1208;fill:none;stroke-linecap:round}
    svg[data-affe="glitzer-gina"] .boa{fill:var(--prop,#FF3E8E)}
    svg[data-affe="glitzer-gina"] #kopf,svg[data-affe="glitzer-gina"] #arm-l,svg[data-affe="glitzer-gina"] #arm-r,svg[data-affe="glitzer-gina"] #bein-l,svg[data-affe="glitzer-gina"] #bein-r,svg[data-affe="glitzer-gina"] #schwanz,svg[data-affe="glitzer-gina"] #krone{transform-box:view-box}
    svg[data-affe="glitzer-gina"] #kopf{transform-origin:120px 158px}
    svg[data-affe="glitzer-gina"] #arm-l{transform-origin:90px 172px}
    svg[data-affe="glitzer-gina"] #arm-r{transform-origin:150px 172px}
    svg[data-affe="glitzer-gina"] #bein-l{transform-origin:102px 246px}
    svg[data-affe="glitzer-gina"] #bein-r{transform-origin:138px 246px}
    svg[data-affe="glitzer-gina"] #schwanz{transform-origin:146px 246px}
    svg[data-affe="glitzer-gina"] #krone{transform-origin:120px 76px}
    svg[data-affe="glitzer-gina"] .gesicht{display:none}
    svg[data-affe="glitzer-gina"] #gesicht-neutral{display:inline}
    svg[data-affe="glitzer-gina"][data-gesicht=jubel] #gesicht-neutral,svg[data-affe="glitzer-gina"][data-gesicht=frust] #gesicht-neutral,svg[data-affe="glitzer-gina"][data-gesicht=denk] #gesicht-neutral{display:none}
    svg[data-affe="glitzer-gina"][data-gesicht=jubel] #gesicht-jubel{display:inline}
    svg[data-affe="glitzer-gina"][data-gesicht=frust] #gesicht-frust{display:inline}
    svg[data-affe="glitzer-gina"][data-gesicht=denk] #gesicht-denk{display:inline}
  </style>

  <g id="schwanz">
    <!-- Eleganter S-Schwung nach oben -->
    <path class="os" d="M 144 248 C 190 244 200 210 182 196 C 168 186 158 202 172 208" stroke-width="15"/>
    <path class="fell-s" d="M 144 248 C 190 244 200 210 182 196 C 168 186 158 202 172 208" stroke-width="8.5"/>
  </g>

  <g id="bein-l">
    <path class="os" d="M 102 246 C 98 266 96 280 94 296" stroke-width="18"/>
    <path class="fell-s" d="M 102 246 C 98 266 96 280 94 296" stroke-width="11"/>
    <ellipse class="fell o" cx="89" cy="302" rx="15" ry="8.5"/>
  </g>
  <g id="bein-r">
    <!-- Pose: ein Bein elegant gekreuzt -->
    <path class="os" d="M 138 246 C 136 266 128 282 118 294" stroke-width="18"/>
    <path class="fell-s" d="M 138 246 C 136 266 128 282 118 294" stroke-width="11"/>
    <ellipse class="fell o" cx="112" cy="300" rx="15" ry="8.5" transform="rotate(-14 112 300)"/>
  </g>

  <g id="koerper">
    <path class="fell o" d="M 94 164 C 84 186 86 220 96 244 L 144 244 C 154 220 156 186 146 164 C 136 152 104 152 94 164 Z"/>
    <!-- Pailletten-Kleidchen -->
    <path class="o" d="M 92 196 L 148 196 L 154 246 L 86 246 Z" fill="#FF3E8E" stroke-width="4.5"/>
    <g fill="#FFDE6B" opacity="0.95">
      <circle cx="102" cy="210" r="2.5"/><circle cx="120" cy="216" r="2.5"/><circle cx="138" cy="208" r="2.5"/>
      <circle cx="110" cy="230" r="2.5"/><circle cx="132" cy="232" r="2.5"/>
    </g>
  </g>

  <g id="arm-l">
    <!-- Hand in die Hüfte gestützt -->
    <path class="os" d="M 90 172 C 74 184 74 200 88 208" stroke-width="16"/>
    <path class="fell-s" d="M 90 172 C 74 184 74 200 88 208" stroke-width="9.5"/>
    <circle class="fell o" cx="94" cy="210" r="9.5"/>
  </g>
  <g id="arm-r">
    <!-- Dauer-Pose: Arm überm Kopf -->
    <path class="os" d="M 150 172 C 170 160 178 138 174 114" stroke-width="16"/>
    <path class="fell-s" d="M 150 172 C 170 160 178 138 174 114" stroke-width="9.5"/>
    <circle class="fell o" cx="172" cy="106" r="9.5"/>
    <path class="os" d="M 166 100 L 162 92 M 172 98 L 172 89 M 178 100 L 182 92" stroke-width="4"/>
    <!-- Glitzer-Funkeln -->
    <g fill="#FFDE6B" stroke="#1A1208" stroke-width="2">
      <path d="M 196 96 L 199 103 L 206 106 L 199 109 L 196 116 L 193 109 L 186 106 L 193 103 Z"/>
      <path d="M 156 76 L 158 81 L 163 83 L 158 85 L 156 90 L 154 85 L 149 83 L 154 81 Z"/>
    </g>
  </g>

  <g id="kopf">
    <circle class="fell o" cx="120" cy="112" r="40"/>
    <circle class="fell o" cx="78" cy="106" r="12"/>
    <circle class="fell o" cx="162" cy="106" r="12"/>
    <circle class="fell-hell" cx="78" cy="106" r="5.5"/>
    <circle class="fell-hell" cx="162" cy="106" r="5.5"/>
    <ellipse class="fell-hell o" cx="120" cy="124" rx="25" ry="18" stroke-width="4"/>
    <!-- Schönheitsfleck -->
    <circle cx="141" cy="122" r="2" fill="#1A1208"/>

    <g id="gesicht-neutral" class="gesicht">
      <circle cx="106" cy="100" r="7" fill="#FFF6E3"/>
      <circle cx="134" cy="100" r="7" fill="#FFF6E3"/>
      <circle cx="107" cy="101" r="3.1" fill="#1A1208"/>
      <circle cx="133" cy="101" r="3.1" fill="#1A1208"/>
      <path class="os" d="M 98 94 L 94 91 M 100 91 L 97 87 M 142 94 L 146 91 M 140 91 L 143 87" stroke-width="2.5"/>
      <circle cx="114" cy="118" r="1.8" fill="#1A1208"/>
      <circle cx="126" cy="118" r="1.8" fill="#1A1208"/>
      <path d="M 111 128 Q 120 134 129 128 Q 120 131 111 128 Z" fill="#C2183B" stroke="#1A1208" stroke-width="2"/>
    </g>
    <g id="gesicht-jubel" class="gesicht">
      <path class="os" d="M 99 100 Q 106 92 113 100" stroke-width="4"/>
      <path class="os" d="M 127 100 Q 134 92 141 100" stroke-width="4"/>
      <path class="os" d="M 97 93 L 93 90 M 143 93 L 147 90" stroke-width="2.5"/>
      <circle cx="114" cy="116" r="1.8" fill="#1A1208"/>
      <circle cx="126" cy="116" r="1.8" fill="#1A1208"/>
      <path d="M 106 123 Q 120 141 134 123 Q 120 128 106 123 Z" fill="#1A1208"/>
      <path d="M 113 131 Q 120 137 127 131 Q 120 139 113 131 Z" fill="#FF3E8E"/>
    </g>
    <g id="gesicht-frust" class="gesicht">
      <path class="os" d="M 98 92 L 113 96" stroke-width="4"/>
      <path class="os" d="M 142 92 L 127 96" stroke-width="4"/>
      <circle cx="108" cy="102" r="2.9" fill="#1A1208"/>
      <circle cx="132" cy="102" r="2.9" fill="#1A1208"/>
      <circle cx="114" cy="118" r="1.8" fill="#1A1208"/>
      <circle cx="126" cy="118" r="1.8" fill="#1A1208"/>
      <path class="os" d="M 110 131 Q 120 124 130 131" stroke-width="3.5"/>
    </g>
    <g id="gesicht-denk" class="gesicht">
      <circle cx="106" cy="100" r="7" fill="#FFF6E3"/>
      <circle cx="134" cy="100" r="7" fill="#FFF6E3"/>
      <circle cx="105" cy="97" r="2.9" fill="#1A1208"/>
      <circle cx="133" cy="97" r="2.9" fill="#1A1208"/>
      <path class="os" d="M 97 89 L 111 85" stroke-width="3.5"/>
      <circle cx="114" cy="118" r="1.8" fill="#1A1208"/>
      <circle cx="126" cy="118" r="1.8" fill="#1A1208"/>
      <path class="os" d="M 112 129 Q 117 125 122 129 Q 127 133 131 129" stroke-width="3.5"/>
    </g>

    <!-- Federboa um den Hals -->
    <g id="prop-boa">
      <g class="boa" stroke="#1A1208" stroke-width="3">
        <circle cx="86" cy="152" r="11"/><circle cx="104" cy="158" r="11"/>
        <circle cx="122" cy="160" r="11"/><circle cx="140" cy="157" r="11"/>
        <circle cx="156" cy="149" r="11"/><circle cx="76" cy="166" r="10"/>
        <circle cx="70" cy="182" r="9"/>
      </g>
      <g fill="#FFDE6B" opacity="0.9">
        <circle cx="96" cy="154" r="2"/><circle cx="130" cy="160" r="2"/><circle cx="150" cy="150" r="2"/>
      </g>
    </g>

    <!-- Hochgesteckte Federkrone -->
    <g id="krone">
      <g id="prop-federkrone">
        <path class="o" d="M 116 78 C 110 52 112 28 122 8 C 126 30 124 54 122 76 Z" fill="#FF3E8E" stroke-width="4"/>
        <path class="o" d="M 100 80 C 88 62 84 42 88 24 C 98 40 104 62 108 78 Z" fill="#29D9D5" stroke-width="4"/>
        <path class="o" d="M 130 78 C 136 58 146 40 158 30 C 154 50 146 68 138 80 Z" fill="#F5B301" stroke-width="4"/>
        <path class="o" d="M 88 86 C 76 76 68 62 66 48 C 78 58 88 72 94 84 Z" fill="#8FE04B" stroke-width="4"/>
        <path class="o" d="M 146 84 C 158 74 168 62 174 50 C 172 66 162 80 152 88 Z" fill="#8B5CF6" stroke-width="4"/>
        <path class="o" d="M 98 88 C 106 80 134 80 142 88 C 134 96 106 96 98 88 Z" fill="#F5B301" stroke-width="4"/>
        <circle class="o" cx="120" cy="87" r="6" fill="#FF3E8E" stroke-width="3.5"/>
      </g>
    </g>
    <g id="accessoire"/>
  </g>
</svg>
