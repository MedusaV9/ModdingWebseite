<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 704" role="img" aria-label="MONKEY MONEY">
  <title>MONKEY MONEY  Wortmarke</title>
  <defs>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B301" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
    <!-- Goldmünze mit Affenkopf-Prägung, Basisradius 50 -->
    <g id="muenze-basis">
      <circle cx="-8" cy="8" r="50" fill="#1A1208" opacity="0.5"/>
      <circle r="50" fill="#F5B301" stroke="#1A1208" stroke-width="5"/>
      <circle r="39" fill="none" stroke="#FFDE6B" stroke-width="4"/>
      <path d="M -34 -22 A 40 40 0 0 1 -13 -37" fill="none" stroke="#FFDE6B" stroke-width="6" stroke-linecap="round"/>
      <!-- Affenkopf-Prägung (frontal) -->
      <g fill="#1A1208" opacity="0.85">
        <circle cx="-17" cy="-9" r="8"/>
        <circle cx="17" cy="-9" r="8"/>
        <circle cx="0" cy="-2" r="19"/>
      </g>
      <ellipse cx="0" cy="6" rx="11.5" ry="8.5" fill="#F5B301"/>
      <circle cx="-7" cy="-8" r="3" fill="#F5B301"/>
      <circle cx="7" cy="-8" r="3" fill="#F5B301"/>
      <circle cx="-3.5" cy="4" r="1.6" fill="#1A1208"/>
      <circle cx="3.5" cy="4" r="1.6" fill="#1A1208"/>
      <path d="M -5 9.5 A 6 4.5 0 0 0 5 9.5" fill="none" stroke="#1A1208" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Hintergrund (Jungle Night)  Gruppe ausblendbar für transparente Nutzung -->
  <g id="hintergrund">
    <rect width="1024" height="704" rx="48" fill="#0E2A1F"/>
    <ellipse cx="512" cy="360" rx="470" ry="330" fill="url(#glowGold)"/>
  </g>

  <!-- Emblem Bananen-Dollar": Banane, um die sich der $-Doppelbalken wickelt -->
  <g id="emblem" transform="translate(512 128) rotate(-6)">
    <path d="M -92 -20 C -78 26 -34 46 6 46 C 46 46 80 18 90 -24" fill="none" stroke="#1A1208" stroke-width="46" stroke-linecap="round"/>
    <path d="M -92 -20 C -78 26 -34 46 6 46 C 46 46 80 18 90 -24" fill="none" stroke="#FFC93C" stroke-width="35" stroke-linecap="round"/>
    <path d="M -78 -16 C -64 20 -28 36 4 37" fill="none" stroke="#FFDE6B" stroke-width="9" stroke-linecap="round"/>
    <path d="M -102 -38 L -108 -52" stroke="#1A1208" stroke-width="15" stroke-linecap="round"/>
    <path d="M 98 -42 L 103 -56" stroke="#1A1208" stroke-width="15" stroke-linecap="round"/>
    <g stroke="#1A1208" stroke-width="5">
      <rect x="-21" y="0" width="15" height="90" rx="7" fill="#F5B301" transform="rotate(3)"/>
      <rect x="8" y="-2" width="15" height="90" rx="7" fill="#F5B301" transform="rotate(-2)"/>
    </g>
  </g>

  <!-- Wortmarke: MONKEY" (?1.5°) über MONEY" (+1.5°) = 3° gegeneinander -->
  <g id="wort-monkey" transform="rotate(-1.5 512 330)">
    <text x="234.5" y="368" font-family="'Bungee Shade','Bungee',sans-serif" font-size="110"
      fill="#FFC93C" stroke="#F5B301" stroke-width="2" paint-order="stroke">M<tspan opacity="0">O</tspan>NKEY</text>
    <use href="#muenze-basis" transform="translate(385 326) scale(0.94)"/>
  </g>

  <g id="wort-money" transform="rotate(1.5 512 490)">
    <text x="218.1" y="540" font-family="'Bungee Shade','Bungee',sans-serif" font-size="140"
      fill="#FFC93C" stroke="#F5B301" stroke-width="2.5" paint-order="stroke">M<tspan opacity="0">O</tspan>NEY</text>
    <use href="#muenze-basis" transform="translate(409.6 486) scale(1.18)"/>
  </g>

  <!-- Affenschwanz aus dem Y: unterstreicht die Wortmarke, endet im Ringel -->
  <g id="schwanz" fill="none" stroke-linecap="round">
    <path d="M 774 536 C 802 598 764 638 644 650 C 528 660 424 656 362 644 C 320 634 314 604 340 594 C 362 586 374 606 358 616"
      stroke="#1A1208" stroke-width="24"/>
    <path d="M 774 536 C 802 598 764 638 644 650 C 528 660 424 656 362 644 C 320 634 314 604 340 594 C 362 586 374 606 358 616"
      stroke="#F5B301" stroke-width="13"/>
  </g>
</svg>
