<!-- Fell Gold-Glitzer"  nahtlose Pattern-Kachel (48×48): warmer Gold-Schleier
     über var(--fell) + Funkel-Sterne, deren Opacity per SMIL sanft atmet
     (degradiert ohne SMIL zu statischem Glitzer; das Gesamt-Schimmern macht
     zusätzlich die CSS-Klasse mm-gold-schimmer in meta-avatar.ts). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" fill="var(--fell, #6B4226)"/>
  <rect width="48" height="48" fill="#F5B301" opacity="0.2"/>
  <g fill="#FFF3B0" stroke="#B97309" stroke-width="0.8" stroke-linejoin="round">
    <path d="M 10 8 L 11.4 11.6 L 15 13 L 11.4 14.4 L 10 18 L 8.6 14.4 L 5 13 L 8.6 11.6 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M 34 6 L 35 8.6 L 37.6 9.6 L 35 10.6 L 34 13.2 L 33 10.6 L 30.4 9.6 L 33 8.6 Z">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 22 28 L 23.2 31 L 26.2 32.2 L 23.2 33.4 L 22 36.4 L 20.8 33.4 L 17.8 32.2 L 20.8 31 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 40 36 L 40.9 38.3 L 43.2 39.2 L 40.9 40.1 L 40 42.4 L 39.1 40.1 L 36.8 39.2 L 39.1 38.3 Z">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#FFF6E3" opacity="0.7">
    <circle cx="7" cy="38" r="0.9"/>
    <circle cx="28" cy="14" r="0.9"/>
    <circle cx="44" cy="22" r="0.9"/>
    <circle cx="16" cy="45" r="0.9"/>
  </g>
</svg>
