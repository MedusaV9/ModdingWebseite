name: SoooDreamy
options:
  bundleIdPrefix: app.sooodreamy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "12"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""

targets:
  SoooDreamy:
    type: application
    platform: iOS
    sources:
      - path: SoooDreamy
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sooodreamy.ios
        PRODUCT_NAME: SoooDreamy
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/SoooDreamy-Info.plist
      properties:
        CFBundleDisplayName: SoooDreamy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "SoooDreamy uses the microphone to record voice notes for your partner."
        NSCameraUsageDescription: "SoooDreamy uses the camera to scan your partner's pairing QR code."
        NSPhotoLibraryAddUsageDescription: "SoooDreamy can save shared photos to your photo library."
        NSFaceIDUsageDescription: "SoooDreamy can lock your shared moments behind Face ID."
        NSLocalNetworkUsageDescription: "SoooDreamy connects to your own couple server on your home network."
        # Self-hosted couple servers usually run plain HTTP (LAN IP / Raspberry Pi /
        # port-forward). ATS is opened deliberately; HTTPS still works and is
        # recommended for servers exposed to the internet (reverse proxy).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            ark.atomi23.de:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.sooodreamy.ios
            CFBundleURLSchemes:
              - sooodreamy
    entitlements:
      path: Config/SoooDreamy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.sooodreamy.shared
    dependencies:
      - target: SoooDreamyWidgets

  SoooDreamyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sooodreamy.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Config/SoooDreamyWidgets-Info.plist
      properties:
        CFBundleDisplayName: "SoooDreamy Widgets"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The photo widget fetches images from the self-hosted (often plain
        # HTTP) couple server — same deliberate ATS opening as the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            ark.atomi23.de:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
    entitlements:
      path: Config/SoooDreamyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.sooodreamy.shared

schemes:
  SoooDreamy:
    build:
      targets:
        SoooDreamy: all
    run:
      config: Debug
    archive:
      config: Release
