plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    // GeckoLib (animierte Entities/Bloecke) + optionale Curios-/Create-APIs
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Multiplayer-Testclient: verbindet sich direkt auf den Dev-Server (Port 26565)
        clientMp {
            client()
            gameDirectory = project.file('run-mp')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:26565', '--username', 'sophiex456'
        }
        // Zweiter MP-Testclient (Fremdname!): fuer 2-Client-Tests (Hut-Sync, Sophie-Lokalitaet)
        clientMp2 {
            client()
            gameDirectory = project.file('run-mp2')
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:26565', '--username', 'maxi789'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            // -PwithCreate: nur Create-Suite; -PwithSoak: nur Langzeit-Soak; sonst Kernsuite.
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    project.hasProperty('withCreate') ? "${project.mod_id}_create"
                            : project.hasProperty('withSoak') ? "${project.mod_id}_soak"
                            : project.mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2"
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    if (project.hasProperty('withCreate')) {
        runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
            transitive = false
        }
        runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
        runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
        runtimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
