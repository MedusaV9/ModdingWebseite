name: Mod Jar
# Builds and tests release branches/tags, then uploads the exact jar artifact.
on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "scripts/**"
      - "assets_src/**"
      - "docs/**"
      - "versions/README.md"
      - "PATCHNOTES.md"
      - "CHANGELOG.md"
      - "README.md"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/modjar.yml"
  workflow_dispatch: {}

concurrency:
  group: modjar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Fetch optional external assets
        run: |
          if [ -f tools/fetch_assets.py ]; then python3 tools/fetch_assets.py; fi
      - name: Validate Gooby assets (fail-closed)
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/test_validate_assets.py
          python3 scripts/validate_assets.py
      - name: Release metadata gate (fail-closed)
        run: |
          python3 scripts/test_release.py
          python3 scripts/release.py --check-only
      - name: Build mod jar
        run: ./gradlew clean build --no-daemon --max-workers=2
      - name: Run fatal GameTests
        run: |
          if grep -rq "@GameTest" src/main/java 2>/dev/null || grep -rq "GameTestHolder" src/main/java 2>/dev/null; then
            ./gradlew runGameTestServer --no-daemon --max-workers=2
          fi
      - name: Upload versioned jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: goobymod-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
