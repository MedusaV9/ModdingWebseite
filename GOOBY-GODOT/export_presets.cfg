; GOOBY Export-Presets — Owner: W2b UPDATES (Plan §3.1).
;
; Preset 0 "ios": aktiver Export für den ios-ipa-Job in gooby-godot.yml.
;   Signing bleibt leer: die IPA wird UNSIGNED gebaut (xcodebuild
;   CODE_SIGNING_ALLOWED=NO), danach forensisch geprüft und per
;   AltStore/Sideloadly neu signiert installiert.
;   application/short_version & version kommen aus application/config/version
;   (project.godot). CI vergleicht Tag/Dispatch, Projektversion sowie
;   CFBundleShortVersionString + CFBundleVersion fail-closed.
;   exclude_filter (W15-TECHKIT-Request): der GOB-NOM-@tool-Level-Editor
;   (scripts/minigames/games/gobnom/editor/**) ist reines Dev-Werkzeug —
;   auch seine kompilierten .gdc bleiben aus der IPA draußen (Gürtel zu den
;   OS.has_feature("editor")-Laufzeit-Guards). Kein Laufzeitcode referenziert
;   den Ordner; die Pack-Presets 1–6 (include_filter content/*) sind
;   unberührt.
;   IPA-DIÄT (EVAL-2026-08 Lens C, Befund 9): tests/** (Testsuite, Fixtures,
;   Expected-JSONs — 1382 PCK-Einträge), tools/** (capture-/audit-/blender-
;   Dev-Pipelines) und die headless SceneTree-Dev-Treiber unter scripts/
;   (perf_probe, fb1_*-Proben, verify_pack_cli) bleiben aus der IPA draußen.
;   Laufzeit-verifiziert per rg: der EINZIGE Produktzugriff auf res://tests/
;   ist DevActions.fixture_saves() — explizit export-sicher gebaut
;   („Leer im Export ohne tests/", DirAccess.open == null wird abgefangen);
;   res://tools/ hat KEINE Laufzeit-Referenz, alle Treffer auf perf_probe/
;   orientation_audit/fb1_* in scripts/ sind Kommentare. tools/ci/
;   verify_ipa.py verbietet tests/- und tools/-Pfade im PCK (fail-closed,
;   Ratsche gegen Rückfall).
;
; Presets 1–6 "pack-<id>": Daten-Packs für `godot --headless --export-pack`
;   (tools/packs/build_packs.sh). Plattform Linux ist nur Formalie — ein .pck ist
;   plattformneutral (reines Datenarchiv). export_filter="resources" +
;   include_filter="*content/<id>/*" packt NUR den jeweiligen content-Ordner
;   inkl. der Nicht-Resource-JSONs (klassische Falle: JSON-Filter vergessen →
;   Pack ohne Daten; CI-Smoketest: scripts/updates/verify_pack_cli.gd).
;   exclude_filter wirft die von Godot erzwungenen Skripte raus (Autoload-.gdc/
;   .remap) — Data-only-Policy Doc B §4.3: alte Packs dürfen NIE App-Skripte
;   überschatten. Die verbleibenden Zwangsdateien (project.binary, Class-/
;   UID-Cache, icon.svg) werden nur beim App-Start VOR dem Pack-Load gelesen
;   und sind zur Laufzeit inert (verifiziert; Details docs/UPDATES.md §8).
;   Der config-"Pack" ist KEIN PCK (plain JSON, Doc B §1.1) → kein Preset.

[preset.0]

name="ios"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="res://scripts/minigames/games/gobnom/editor/*, res://tests/*, res://tools/*, res://scripts/dev/perf_probe.gd, res://scripts/character/fb1_*.gd, res://scripts/updates/verify_pack_cli.gd"
export_path="build/ios/GOOBY.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
application/app_store_team_id="0000000000"
application/provisioning_profile_uuid_debug=""
application/code_sign_identity_debug=""
application/provisioning_profile_uuid_release=""
application/code_sign_identity_release=""
application/export_project_only=true
application/bundle_identifier="com.permissionmaxed.gooby"
application/signature=""
application/short_version=""
application/version=""
application/icon_interpolation=4
icons/app_store_1024x1024="res://icon_gooby_1024.png"
; Lens C Befund 10b: echte 120/180-Assets (Pillow-LANCZOS aus dem 1024er,
; tools-seitig erzeugt) statt Godots Auto-Resize der 1024er-Quelle — der
; Export warnte sonst bei jedem Lauf ("Icon ... is being automatically
; resized"). Das Warnungs-Gate im ios-ipa-Job haelt diese Warnung ab jetzt
; fail-closed draussen.
icons/iphone_120x120="res://icon_gooby_120.png"
icons/iphone_180x180="res://icon_gooby_180.png"
application/launch_screens_interpolation=4
; GOOBY-WIDGETS: 14.0 → 15.0. Die goobykit-Swift-Laufzeit (Live Activities,
; ActivityKit) braucht Swift Concurrency; unter iOS 15 muesste dafuer
; libswift_Concurrency.dylib in die App eingebettet werden — verify_ipa.py
; verbietet Nicht-System-Dylibs bewusst (Sideload-Haerte). Ab iOS 15 liegt
; die Lib im System. Widgets/Live Activities selbst brauchen iOS 16.2+
; (Extension-Target), die App laeuft ab 15.0 unveraendert.
application/min_ios_version="15.0"
application/additional_plist_content=""
application/export_method_debug=1
application/export_method_release=0
application/targeted_device_family=2
capabilities/access_wifi=false
capabilities/push_notifications=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
; GOOBY-WIDGETS: bindet ios/plugins/goobykit/goobykit.gdip ein. Die .a baut
; tools/ci/build_goobykit.sh im ios-ipa-Job VOR dem Export — lokale Exporte
; ohne diesen Schritt brechen mit klarem "goobykit.a fehlt" ab.
plugins/goobykit=true
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""
; FIX1 (P0 „startet im Hochformat“): Der Start-/Standardmodus kommt aus
; project.godot display/window/handheld/orientation=4 (SENSOR_LANDSCAPE) —
; Godot setzt die Orientierungs-Maske damit im ersten Frame auf Querformat
; UND schreibt entsprechend NUR die beiden Landscape-Keys in die Info.plist.
; Das Preset-Feld `portrait` wird dabei ignoriert; stand es auf true, wich die
; gebaute .ipa vom Preset ab (die Bau-Verifikation hat genau das gemeldet).
; Deshalb ist das Spiel bewusst querformat-first: Hochkant-Minigames laufen
; im Querformat-Fenster sauber im Pillarbox (vom Framework verifiziert),
; statt dass beim Start sichtbar gedreht wird.
orientation/portrait=false
orientation/landscape_left=true
orientation/landscape_right=true
orientation/portrait_upside_down=false

