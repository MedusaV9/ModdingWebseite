; GOOBY Export-Presets — Owner: W2b UPDATES (Plan §3.1).
;
; Preset 0 "ios": aktiver Export für den ios-ipa-Job in gooby-godot.yml.
;   Signing bleibt leer: die IPA wird UNSIGNED gebaut (xcodebuild
;   CODE_SIGNING_ALLOWED=NO), danach forensisch geprüft und per
;   AltStore/Sideloadly neu signiert installiert.
;   application/short_version & version kommen aus application/config/version
;   (project.godot-Request: 5.0.0).
;
; Presets 1–6 "pack-<id>": Daten-Packs für `godot --headless --export-pack`
;   (tools/packs/build_packs.sh). Plattform Linux ist nur Formalie — ein .pck ist
;   plattformneutral (reines Datenarchiv). export_filter="resources" +
;   include_filter="*content/<id>/*" packt NUR den jeweiligen content-Ordner
;   inkl. der Nicht-Resource-JSONs (klassische Falle: JSON-Filter vergessen →
;   Pack ohne Daten; CI-Smoketest: scripts/updates/verify_pack_cli.gd).
;   exclude_filter wirft die von Godot erzwungenen Skripte raus (Autoload-.gdc/
;   .remap) — Data-only-Policy Doc B §4.3: alte Packs dürfen NIE App-Skripte
;   überschatten. Die verbleibenden Zwangsdateien (project.binary, Class-/
;   UID-Cache, icon.svg) werden nur beim App-Start VOR dem Pack-Load gelesen
;   und sind zur Laufzeit inert (verifiziert; Details docs/UPDATES.md §8).
;   Der config-"Pack" ist KEIN PCK (plain JSON, Doc B §1.1) → kein Preset.

[preset.0]

name="ios"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
export_path="build/ios/GOOBY.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
application/app_store_team_id="0000000000"
application/provisioning_profile_uuid_debug=""
application/code_sign_identity_debug=""
application/provisioning_profile_uuid_release=""
application/code_sign_identity_release=""
application/export_project_only=true
application/bundle_identifier="com.permissionmaxed.gooby"
application/signature=""
application/short_version=""
application/version=""
application/icon_interpolation=4
icons/app_store_1024x1024="res://icon_gooby_1024.png"
icons/iphone_120x120="res://icon_gooby_1024.png"
icons/iphone_180x180="res://icon_gooby_1024.png"
application/launch_screens_interpolation=4
application/min_ios_version="14.0"
application/additional_plist_content=""
application/export_method_debug=1
application/export_method_release=0
application/targeted_device_family=2
capabilities/access_wifi=false
capabilities/push_notifications=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""
; FIX1 (P0 „startet im Hochformat“): Der Start-/Standardmodus kommt aus
; project.godot display/window/handheld/orientation=4 (SENSOR_LANDSCAPE) —
; Godot setzt die Orientierungs-Maske damit im ersten Frame auf Querformat.
; `portrait` MUSS hier trotzdem aktiviert bleiben: iOS schneidet die
; UISupportedInterfaceOrientations aus der Plist mit der Laufzeit-Maske —
; ohne Portrait-Key könnten Hochkant-Minigames (OrientationService.lock)
; nie drehen. Nur „upside down“ ist bewusst aus (will niemand).
orientation/portrait=true
orientation/landscape_left=true
orientation/landscape_right=true
orientation/portrait_upside_down=false

[preset.1]

name="pack-core"
platform="Linux"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="resources"
export_files=PackedStringArray()
include_filter="*content/core/*"
exclude_filter="*.gd, *.gdc, *.remap, res://.godot/*, res://icon.svg, res://project.binary"
export_path="build/packs/core.pck"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/architecture="x86_64"

