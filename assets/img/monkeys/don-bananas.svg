<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="mm-affe" data-affe="don-bananas" role="img" aria-label="Don Bananas">
  <title>Don Bananas — der Pate</title>
  <style>
    svg[data-affe="don-bananas"] .fell{fill:var(--fell,#6B4226)}
    svg[data-affe="don-bananas"] .fell-hell{fill:var(--fell-hell,#D9B08C)}
    svg[data-affe="don-bananas"] .fell-s{stroke:var(--fell,#6B4226);fill:none}
    svg[data-affe="don-bananas"] .o{stroke:#1A1208;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    svg[data-affe="don-bananas"] .os{stroke:#1A1208;fill:none;stroke-linecap:round}
    svg[data-affe="don-bananas"] #kopf,svg[data-affe="don-bananas"] #arm-l,svg[data-affe="don-bananas"] #arm-r,svg[data-affe="don-bananas"] #bein-l,svg[data-affe="don-bananas"] #bein-r,svg[data-affe="don-bananas"] #schwanz{transform-box:view-box}
    svg[data-affe="don-bananas"] #kopf{transform-origin:120px 140px}
    svg[data-affe="don-bananas"] #arm-l{transform-origin:86px 156px}
    svg[data-affe="don-bananas"] #arm-r{transform-origin:154px 156px}
    svg[data-affe="don-bananas"] #bein-l{transform-origin:102px 238px}
    svg[data-affe="don-bananas"] #bein-r{transform-origin:138px 238px}
    svg[data-affe="don-bananas"] #schwanz{transform-origin:146px 238px}
    svg[data-affe="don-bananas"] .gesicht{display:none}
    svg[data-affe="don-bananas"] #gesicht-neutral{display:inline}
    svg[data-affe="don-bananas"][data-gesicht=jubel] #gesicht-neutral,svg[data-affe="don-bananas"][data-gesicht=frust] #gesicht-neutral,svg[data-affe="don-bananas"][data-gesicht=denk] #gesicht-neutral{display:none}
    svg[data-affe="don-bananas"][data-gesicht=jubel] #gesicht-jubel{display:inline}
    svg[data-affe="don-bananas"][data-gesicht=frust] #gesicht-frust{display:inline}
    svg[data-affe="don-bananas"][data-gesicht=denk] #gesicht-denk{display:inline}
  </style>

  <g id="schwanz">
    <path class="os" d="M 144 240 C 192 252 214 216 188 202 C 172 194 164 210 178 214" stroke-width="17"/>
    <path class="fell-s" d="M 144 240 C 192 252 214 216 188 202 C 172 194 164 210 178 214" stroke-width="10"/>
  </g>

  <g id="bein-l">
    <path class="os" d="M 102 238 C 96 262 94 278 92 294" stroke-width="21"/>
    <path class="fell-s" d="M 102 238 C 96 262 94 278 92 294" stroke-width="13"/>
    <ellipse class="fell o" cx="86" cy="301" rx="18" ry="9.5"/>
  </g>
  <g id="bein-r">
    <path class="os" d="M 138 238 C 144 262 146 278 148 294" stroke-width="21"/>
    <path class="fell-s" d="M 138 238 C 144 262 146 278 148 294" stroke-width="13"/>
    <ellipse class="fell o" cx="154" cy="301" rx="18" ry="9.5"/>
  </g>

  <g id="koerper">
    <!-- Nadelstreifen-Sakko: breite Pate-Schultern -->
    <path class="o" d="M 66 144 C 52 154 58 180 76 186 C 72 214 80 232 92 242 L 148 242 C 160 232 168 214 164 186 C 182 180 188 154 174 144 C 150 130 90 130 66 144 Z" fill="#33303B"/>
    <g stroke="#514D5C" stroke-width="2.5" opacity="0.9">
      <path d="M 88 150 C 86 180 88 216 94 238" fill="none"/>
      <path d="M 104 146 C 102 180 104 218 108 240" fill="none"/>
      <path d="M 136 146 C 138 180 136 218 132 240" fill="none"/>
      <path d="M 152 150 C 154 180 152 216 146 238" fill="none"/>
    </g>
    <!-- Hemd + Gold-Krawatte -->
    <path class="o" d="M 106 142 L 120 166 L 134 142 Z" fill="#FFF6E3" stroke-width="4"/>
    <path class="o" d="M 116 158 L 124 158 L 128 196 L 120 208 L 112 196 Z" fill="#F5B301" stroke-width="4"/>
    <!-- Revers -->
    <path class="os" d="M 106 142 L 96 168 L 108 178" stroke-width="4" fill="none"/>
    <path class="os" d="M 134 142 L 144 168 L 132 178" stroke-width="4" fill="none"/>
    <!-- Einstecktuch -->
    <path class="o" d="M 138 176 L 152 172 L 148 186 Z" fill="#FF3E8E" stroke-width="3.5"/>
  </g>

  <g id="arm-l">
    <path class="os" d="M 86 156 C 74 178 70 200 70 220" stroke-width="20"/>
    <path d="M 86 156 C 74 178 70 200 70 220" stroke="#33303B" stroke-width="13" fill="none" stroke-linecap="round"/>
    <circle class="fell o" cx="69" cy="227" r="11"/>
  </g>
  <g id="arm-r">
    <path class="os" d="M 154 156 C 166 176 172 196 172 214" stroke-width="20"/>
    <path d="M 154 156 C 166 176 172 196 172 214" stroke="#33303B" stroke-width="13" fill="none" stroke-linecap="round"/>
    <circle class="fell o" cx="173" cy="222" r="11"/>
    <!-- Bananen-Zigarre mit Glut -->
    <g id="prop-zigarre" transform="translate(173 222) rotate(-24)">
      <path d="M -4 -6 C 6 -14 20 -14 30 -6" fill="none" stroke="#1A1208" stroke-width="13" stroke-linecap="round"/>
      <path d="M -4 -6 C 6 -14 20 -14 30 -6" fill="none" stroke="#FFC93C" stroke-width="8" stroke-linecap="round"/>
      <circle cx="33" cy="-7" r="5" fill="#F97316" stroke="#1A1208" stroke-width="3"/>
      <path d="M 38 -16 C 44 -22 38 -28 44 -34" fill="none" stroke="#CFC9C2" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <g id="kopf">
    <circle class="fell o" cx="120" cy="94" r="44"/>
    <circle class="fell o" cx="73" cy="86" r="13"/>
    <circle class="fell o" cx="167" cy="86" r="13"/>
    <circle class="fell-hell" cx="73" cy="86" r="6"/>
    <circle class="fell-hell" cx="167" cy="86" r="6"/>
    <ellipse class="fell-hell o" cx="120" cy="106" rx="27" ry="20" stroke-width="4"/>

    <g id="gesicht-neutral" class="gesicht">
      <circle cx="104" cy="82" r="7.5" fill="#FFF6E3"/>
      <circle cx="136" cy="82" r="7.5" fill="#FFF6E3"/>
      <circle cx="105" cy="83" r="3.4" fill="#1A1208"/>
      <circle cx="135" cy="83" r="3.4" fill="#1A1208"/>
      <path class="os" d="M 95 72 L 111 70" stroke-width="4"/>
      <path class="os" d="M 129 70 L 145 72" stroke-width="4"/>
      <circle cx="112" cy="100" r="2.2" fill="#1A1208"/>
      <circle cx="128" cy="100" r="2.2" fill="#1A1208"/>
      <path class="os" d="M 106 112 Q 120 119 134 112" stroke-width="4"/>
    </g>
    <g id="gesicht-jubel" class="gesicht">
      <path class="os" d="M 97 82 Q 104 74 111 82" stroke-width="4.5"/>
      <path class="os" d="M 129 82 Q 136 74 143 82" stroke-width="4.5"/>
      <circle cx="112" cy="98" r="2.2" fill="#1A1208"/>
      <circle cx="128" cy="98" r="2.2" fill="#1A1208"/>
      <path d="M 104 106 Q 120 128 136 106 Q 120 112 104 106 Z" fill="#1A1208"/>
      <path d="M 112 115 Q 120 122 128 115 Q 120 124 112 115 Z" fill="#FF3E8E"/>
    </g>
    <g id="gesicht-frust" class="gesicht">
      <path class="os" d="M 96 74 L 112 80" stroke-width="4.5"/>
      <path class="os" d="M 144 74 L 128 80" stroke-width="4.5"/>
      <circle cx="106" cy="86" r="3.2" fill="#1A1208"/>
      <circle cx="134" cy="86" r="3.2" fill="#1A1208"/>
      <circle cx="112" cy="99" r="2.2" fill="#1A1208"/>
      <circle cx="128" cy="99" r="2.2" fill="#1A1208"/>
      <path class="os" d="M 106 115 Q 120 106 134 115" stroke-width="4"/>
    </g>
    <g id="gesicht-denk" class="gesicht">
      <circle cx="104" cy="82" r="7.5" fill="#FFF6E3"/>
      <circle cx="136" cy="82" r="7.5" fill="#FFF6E3"/>
      <circle cx="103" cy="79" r="3.2" fill="#1A1208"/>
      <circle cx="133" cy="79" r="3.2" fill="#1A1208"/>
      <path class="os" d="M 94 70 L 110 66" stroke-width="4"/>
      <path class="os" d="M 128 68 Q 138 62 146 70" stroke-width="4"/>
      <circle cx="112" cy="100" r="2.2" fill="#1A1208"/>
      <circle cx="128" cy="100" r="2.2" fill="#1A1208"/>
      <path class="os" d="M 108 112 Q 114 108 120 112 Q 126 116 132 112" stroke-width="4"/>
    </g>

    <!-- Accessoire-Slot: Fedora mit Gold-Band -->
    <g id="accessoire">
      <g id="prop-fedora" transform="rotate(-3 120 52)">
        <ellipse class="o" cx="120" cy="55" rx="47" ry="12" fill="#33303B"/>
        <path class="o" d="M 90 52 C 88 30 98 18 120 18 C 142 18 152 30 154 52 C 138 60 102 60 90 52 Z" fill="#33303B"/>
        <path d="M 89 46 C 108 54 132 54 155 46 L 155 52 C 136 60 104 60 89 52 Z" fill="#F5B301" stroke="#1A1208" stroke-width="3.5"/>
      </g>
    </g>
  </g>
</svg>
