<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" class="mm-affe" data-affe="baron-von-bananenstein" role="img" aria-label="Baron Bodo von Bananenstein">
  <title>Baron Bodo von Bananenstein — der (verarmte) Adelige</title>
  <style>
    svg[data-affe="baron-von-bananenstein"] .fell{fill:var(--fell,#DDB65C)}
    svg[data-affe="baron-von-bananenstein"] .fell-hell{fill:var(--fell-hell,#F2E3B8)}
    svg[data-affe="baron-von-bananenstein"] .fell-s{stroke:var(--fell,#DDB65C);fill:none}
    svg[data-affe="baron-von-bananenstein"] .o{stroke:#1A1208;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    svg[data-affe="baron-von-bananenstein"] .os{stroke:#1A1208;fill:none;stroke-linecap:round}
    svg[data-affe="baron-von-bananenstein"] .umhang{fill:var(--prop,#8B5CF6)}
    svg[data-affe="baron-von-bananenstein"] #kopf,svg[data-affe="baron-von-bananenstein"] #arm-l,svg[data-affe="baron-von-bananenstein"] #arm-r,svg[data-affe="baron-von-bananenstein"] #bein-l,svg[data-affe="baron-von-bananenstein"] #bein-r,svg[data-affe="baron-von-bananenstein"] #schwanz{transform-box:view-box}
    svg[data-affe="baron-von-bananenstein"] #kopf{transform-origin:120px 148px}
    svg[data-affe="baron-von-bananenstein"] #arm-l{transform-origin:88px 164px}
    svg[data-affe="baron-von-bananenstein"] #arm-r{transform-origin:152px 164px}
    svg[data-affe="baron-von-bananenstein"] #bein-l{transform-origin:102px 240px}
    svg[data-affe="baron-von-bananenstein"] #bein-r{transform-origin:138px 240px}
    svg[data-affe="baron-von-bananenstein"] #schwanz{transform-origin:146px 240px}
    svg[data-affe="baron-von-bananenstein"] .gesicht{display:none}
    svg[data-affe="baron-von-bananenstein"] #gesicht-neutral{display:inline}
    svg[data-affe="baron-von-bananenstein"][data-gesicht=jubel] #gesicht-neutral,svg[data-affe="baron-von-bananenstein"][data-gesicht=frust] #gesicht-neutral,svg[data-affe="baron-von-bananenstein"][data-gesicht=denk] #gesicht-neutral{display:none}
    svg[data-affe="baron-von-bananenstein"][data-gesicht=jubel] #gesicht-jubel{display:inline}
    svg[data-affe="baron-von-bananenstein"][data-gesicht=frust] #gesicht-frust{display:inline}
    svg[data-affe="baron-von-bananenstein"][data-gesicht=denk] #gesicht-denk{display:inline}
  </style>

  <!-- Stehkragen-Umhang (hinter allem) -->
  <g id="umhang-hinten">
    <path class="umhang o" d="M 78 118 L 62 106 L 74 132 C 58 176 60 224 72 258 L 168 258 C 180 224 182 176 166 132 L 178 106 L 162 118 C 140 104 100 104 78 118 Z"/>
    <path d="M 84 130 C 78 176 80 220 88 250" fill="none" stroke="#6D45C4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 156 130 C 162 176 160 220 152 250" fill="none" stroke="#6D45C4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="schwanz">
    <path class="os" d="M 144 242 C 192 254 214 218 188 204 C 172 196 164 212 178 216" stroke-width="16"/>
    <path class="fell-s" d="M 144 242 C 192 254 214 218 188 204 C 172 196 164 212 178 216" stroke-width="9"/>
  </g>

  <g id="bein-l">
    <path class="os" d="M 102 240 C 98 262 96 278 94 294" stroke-width="20"/>
    <path class="fell-s" d="M 102 240 C 98 262 96 278 94 294" stroke-width="12.5"/>
    <ellipse class="fell o" cx="88" cy="301" rx="17" ry="9"/>
  </g>
  <g id="bein-r">
    <path class="os" d="M 138 240 C 142 262 144 278 146 294" stroke-width="20"/>
    <path class="fell-s" d="M 138 240 C 142 262 144 278 146 294" stroke-width="12.5"/>
    <ellipse class="fell o" cx="152" cy="301" rx="17" ry="9"/>
  </g>

  <g id="koerper">
    <!-- Weste über Hemd, etwas schmal (verarmter Adel) -->
    <path class="o" d="M 88 156 C 80 176 82 214 92 236 L 148 236 C 158 214 160 176 152 156 C 140 146 100 146 88 156 Z" fill="#3E3654"/>
    <path class="o" d="M 104 150 L 120 176 L 136 150 Z" fill="#FFF6E3" stroke-width="4"/>
    <!-- Jabot/Halstuch + Gold-Nadel -->
    <path class="o" d="M 113 162 C 108 174 112 184 120 188 C 128 184 132 174 127 162 Z" fill="#FFF6E3" stroke-width="3.5"/>
    <circle cx="120" cy="170" r="3.5" fill="#F5B301" stroke="#1A1208" stroke-width="2.5"/>
    <!-- Geflickte Stelle (verarmt!) -->
    <rect x="130" y="208" width="14" height="12" rx="3" fill="#6D45C4" stroke="#1A1208" stroke-width="2.5" transform="rotate(8 137 214)"/>
    <path d="M 132 212 L 142 212 M 134 208 L 134 218" stroke="#1A1208" stroke-width="1.5" transform="rotate(8 137 214)"/>
  </g>

  <g id="arm-l">
    <path class="os" d="M 88 164 C 76 184 72 202 74 218" stroke-width="19"/>
    <path d="M 88 164 C 76 184 72 202 74 218" stroke="#3E3654" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle class="fell o" cx="75" cy="225" r="10.5"/>
  </g>
  <g id="arm-r">
    <!-- Erhobener Arm: Banane als Weinglas -->
    <path class="os" d="M 152 164 C 168 158 178 144 180 128" stroke-width="19"/>
    <path d="M 152 164 C 168 158 178 144 180 128" stroke="#3E3654" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle class="fell o" cx="181" cy="121" r="10.5"/>
    <g id="prop-weinglas-banane" transform="translate(181 112) rotate(-8)">
      <path d="M -10 -2 C -6 -14 6 -14 10 -2" fill="none" stroke="#1A1208" stroke-width="12" stroke-linecap="round"/>
      <path d="M -10 -2 C -6 -14 6 -14 10 -2" fill="none" stroke="#FFC93C" stroke-width="7" stroke-linecap="round"/>
      <path d="M -13 -6 L -16 -14 M 13 -6 L 16 -14" stroke="#1A1208" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <g id="kopf">
    <circle class="fell o" cx="120" cy="98" r="42"/>
    <circle class="fell o" cx="76" cy="90" r="12"/>
    <circle class="fell o" cx="164" cy="90" r="12"/>
    <circle class="fell-hell" cx="76" cy="90" r="5.5"/>
    <circle class="fell-hell" cx="164" cy="90" r="5.5"/>
    <ellipse class="fell-hell o" cx="120" cy="110" rx="26" ry="19" stroke-width="4"/>

    <g id="gesicht-neutral" class="gesicht">
      <circle cx="105" cy="87" r="7" fill="#FFF6E3"/>
      <circle cx="135" cy="87" r="7" fill="#FFF6E3"/>
      <circle cx="106" cy="88" r="3.2" fill="#1A1208"/>
      <circle cx="134" cy="88" r="3.2" fill="#1A1208"/>
      <path class="os" d="M 96 77 L 112 75" stroke-width="4"/>
      <path class="os" d="M 128 75 L 144 77" stroke-width="4"/>
      <circle cx="113" cy="104" r="2" fill="#1A1208"/>
      <circle cx="127" cy="104" r="2" fill="#1A1208"/>
      <path class="os" d="M 108 116 Q 120 121 132 116" stroke-width="4"/>
      <!-- Feiner Schnurrbart -->
      <path class="os" d="M 112 111 C 108 108 104 109 102 112 M 128 111 C 132 108 136 109 138 112" stroke-width="3"/>
    </g>
    <g id="gesicht-jubel" class="gesicht">
      <path class="os" d="M 98 87 Q 105 79 112 87" stroke-width="4.5"/>
      <path class="os" d="M 128 87 Q 135 79 142 87" stroke-width="4.5"/>
      <circle cx="113" cy="102" r="2" fill="#1A1208"/>
      <circle cx="127" cy="102" r="2" fill="#1A1208"/>
      <path d="M 106 110 Q 120 128 134 110 Q 120 115 106 110 Z" fill="#1A1208"/>
      <path class="os" d="M 112 107 C 108 104 104 105 102 108 M 128 107 C 132 104 136 105 138 108" stroke-width="3"/>
    </g>
    <g id="gesicht-frust" class="gesicht">
      <path class="os" d="M 97 79 L 113 84" stroke-width="4.5"/>
      <path class="os" d="M 143 79 L 127 84" stroke-width="4.5"/>
      <circle cx="107" cy="90" r="3" fill="#1A1208"/>
      <circle cx="133" cy="90" r="3" fill="#1A1208"/>
      <circle cx="113" cy="104" r="2" fill="#1A1208"/>
      <circle cx="127" cy="104" r="2" fill="#1A1208"/>
      <path class="os" d="M 108 119 Q 120 111 132 119" stroke-width="4"/>
      <path class="os" d="M 112 113 C 108 110 104 111 102 114 M 128 113 C 132 110 136 111 138 114" stroke-width="3"/>
    </g>
    <g id="gesicht-denk" class="gesicht">
      <circle cx="105" cy="87" r="7" fill="#FFF6E3"/>
      <circle cx="135" cy="87" r="7" fill="#FFF6E3"/>
      <circle cx="104" cy="84" r="3" fill="#1A1208"/>
      <circle cx="134" cy="84" r="3" fill="#1A1208"/>
      <path class="os" d="M 95 75 L 111 71" stroke-width="4"/>
      <circle cx="113" cy="104" r="2" fill="#1A1208"/>
      <circle cx="127" cy="104" r="2" fill="#1A1208"/>
      <path class="os" d="M 110 116 Q 116 112 122 116 Q 128 120 132 116" stroke-width="4"/>
      <path class="os" d="M 112 111 C 108 108 104 109 102 112 M 128 111 C 132 108 136 109 138 112" stroke-width="3"/>
    </g>

    <!-- Monokel (immer sichtbar) -->
    <g id="prop-monokel">
      <circle cx="135" cy="88" r="11.5" fill="none" stroke="#F5B301" stroke-width="4"/>
      <circle cx="135" cy="88" r="11.5" fill="none" stroke="#1A1208" stroke-width="1.5"/>
      <path d="M 144 96 C 150 106 146 116 152 124" fill="none" stroke="#F5B301" stroke-width="2.5"/>
    </g>

    <!-- Zylinder -->
    <g id="accessoire">
      <g id="prop-zylinder" transform="rotate(2 120 44)">
        <ellipse class="o" cx="120" cy="58" rx="46" ry="10" fill="#2B2733"/>
        <path class="o" d="M 92 54 L 90 12 C 110 4 130 4 150 12 L 148 54 C 130 62 110 62 92 54 Z" fill="#2B2733"/>
        <path d="M 91 42 C 110 50 130 50 149 42 L 149 50 C 130 58 110 58 91 50 Z" fill="#8B5CF6" stroke="#1A1208" stroke-width="3.5"/>
      </g>
    </g>
  </g>
</svg>
