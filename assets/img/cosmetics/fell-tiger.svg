    <path d="M 14 17 C 20 15.5 28 18 34 17 L 33 20.5 C 27 21.5 20 19 15 20.5 Z"/>
    <path d="M 16 33 C 22 34.5 30 32 36 33 L 35 36.5 C 29 35.5 22 38 17 36.5 Z"/>
