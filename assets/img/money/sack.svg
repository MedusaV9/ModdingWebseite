<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Geldsack">
  <title>Geldsack — 4 Bündel = 1 Sack (Plan §3.1 Podium)</title>
  <!-- Sackkörper, leicht verkippt (Wonky-Regel) -->
  <g transform="rotate(-2 100 120)">
    <path d="M 100 62 C 56 66 30 100 28 144 C 26 186 56 208 100 208 C 144 208 174 186 172 144 C 170 100 144 66 100 62 Z"
      fill="#B98A4E" stroke="#1A1208" stroke-width="6"/>
    <!-- Zugeschnürter Hals + Knoten -->
    <path d="M 78 58 C 84 46 116 46 122 58 C 118 66 82 66 78 58 Z" fill="#B98A4E" stroke="#1A1208" stroke-width="5"/>
    <path d="M 74 58 C 70 52 74 44 82 44 M 126 58 C 130 52 126 44 118 44" fill="none" stroke="#1A1208" stroke-width="5" stroke-linecap="round"/>
    <path d="M 80 60 L 120 60" stroke="#1A1208" stroke-width="4" stroke-linecap="round"/>
    <!-- Sack-Falten -->
    <g fill="none" stroke="#8A6335" stroke-width="4" stroke-linecap="round">
      <path d="M 62 88 C 54 112 52 150 60 178"/>
      <path d="M 138 88 C 146 112 148 150 140 178"/>
      <path d="M 92 66 C 88 74 88 82 92 88"/>
    </g>
    <!-- Bananen-Dollar-Emblem (wie Logo-Emblem, verkleinert) -->
    <g transform="translate(100 138) rotate(-6) scale(0.42)">
      <path d="M -92 -20 C -78 26 -34 46 6 46 C 46 46 80 18 90 -24" fill="none" stroke="#1A1208" stroke-width="46" stroke-linecap="round"/>
      <path d="M -92 -20 C -78 26 -34 46 6 46 C 46 46 80 18 90 -24" fill="none" stroke="#FFC93C" stroke-width="35" stroke-linecap="round"/>
      <g stroke="#1A1208" stroke-width="5">
        <rect x="-21" y="0" width="15" height="90" rx="7" fill="#F5B301" transform="rotate(3)"/>
        <rect x="8" y="-2" width="15" height="90" rx="7" fill="#F5B301" transform="rotate(-2)"/>
      </g>
    </g>
  </g>
  <!-- Münzen am Boden neben dem Sack -->
  <g stroke="#1A1208" stroke-width="4">
    <circle cx="32" cy="200" r="13" fill="#F5B301"/>
    <circle cx="172" cy="204" r="11" fill="#FFDE6B"/>
  </g>
  <path d="M 26 196 A 8 8 0 0 1 34 191" fill="none" stroke="#FFDE6B" stroke-width="3" stroke-linecap="round"/>
</svg>
