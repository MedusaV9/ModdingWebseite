<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-label="Banana Buck — 50 MM">
  <title>Banana Buck — 1 Schein = 50 MM (Plan §1.5)</title>
  <!-- Spielerfarbe: per CSS --spielerfarbe setzen; Seriennummer-Text per JS in #seriennummer -->

  <rect x="3" y="3" width="414" height="204" rx="10" fill="#85BB65" stroke="#1A1208" stroke-width="6"/>
  <rect x="14" y="14" width="392" height="182" rx="6" fill="none" stroke="#FFF6E3" stroke-width="4"/>
  <rect x="22" y="22" width="376" height="166" rx="4" fill="none" stroke="#5F8F49" stroke-width="2"/>

  <!-- Guilloche-Andeutung: 4 geschwungene Linien (mehr nicht — Flat-Look) -->
  <g fill="none" stroke="#5F8F49" stroke-width="2" opacity="0.75">
    <path d="M 26 60 C 90 20 150 100 210 60 C 270 20 330 100 394 60"/>
    <path d="M 26 105 C 90 65 150 145 210 105 C 270 65 330 145 394 105"/>
    <path d="M 26 150 C 90 110 150 190 210 150 C 270 110 330 190 394 150"/>
    <path d="M 26 82 C 90 122 150 42 210 82 C 270 122 330 42 394 82" opacity="0.5"/>
  </g>

  <!-- Farbbalken links = Spielerfarbe (Klau-Animationen: WESSEN Scheine fliegen) -->
  <rect class="farbbalken" style="fill:var(--spielerfarbe,#FFC93C)" x="30" y="34" width="14" height="142" rx="4" stroke="#1A1208" stroke-width="3"/>
  <text id="seriennummer" x="58" y="172" font-family="Rubik,sans-serif" font-size="11" font-weight="700"
    fill="#1A1208" transform="rotate(-90 58 172)" letter-spacing="1">MM-50-SPIELER</text>

  <!-- Ecken-Wertzahlen (Rubik tabular) -->
  <g font-family="Rubik,sans-serif" font-size="30" font-weight="800" fill="#1A1208" style="font-variant-numeric:tabular-nums">
    <text x="64" y="58">50</text>
    <text x="356" y="58" text-anchor="end">50</text>
    <text x="64" y="166">50</text>
    <text x="356" y="166" text-anchor="end">50</text>
  </g>

  <!-- Oval-Portrait Präsident Bananas" — würdevoll, Monokel, grüne Krawatte -->
  <g id="portrait">
    <ellipse cx="210" cy="100" rx="60" ry="70" fill="#FFF6E3" stroke="#1A1208" stroke-width="5"/>
    <ellipse cx="210" cy="100" rx="52" ry="62" fill="none" stroke="#F5B301" stroke-width="3"/>
    <!-- Büste: Anzug + grüne Krawatte -->
    <path d="M 174 170 C 178 144 192 134 210 134 C 228 134 242 144 246 170 Z" fill="#33303B" stroke="#1A1208" stroke-width="4"/>
    <path d="M 204 136 L 210 144 L 216 136 L 214 162 L 210 168 L 206 162 Z" fill="#22A559" stroke="#1A1208" stroke-width="3"/>
    <!-- Kopf, Dreiviertel-Ansicht (leicht nach links) -->
    <circle cx="206" cy="96" r="30" fill="#6B4226" stroke="#1A1208" stroke-width="4.5"/>
    <circle cx="177" cy="92" r="9" fill="#6B4226" stroke="#1A1208" stroke-width="4"/>
    <circle cx="177" cy="92" r="4" fill="#D9B08C"/>
    <path d="M 186 106 C 184 94 192 86 202 87 C 210 88 216 94 215 104 C 214 114 206 120 197 118 C 190 117 187 112 186 106 Z"
      fill="#D9B08C" stroke="#1A1208" stroke-width="3.5"/>
    <circle cx="196" cy="88" r="5" fill="#FFF6E3"/>
    <circle cx="195" cy="89" r="2.4" fill="#1A1208"/>
    <circle cx="220" cy="88" r="5" fill="#FFF6E3"/>
    <circle cx="219" cy="89" r="2.4" fill="#1A1208"/>
    <!-- Monokel rechts -->
    <circle cx="220" cy="89" r="9" fill="none" stroke="#F5B301" stroke-width="3"/>
    <path d="M 227 96 C 231 104 228 110 232 116" fill="none" stroke="#F5B301" stroke-width="2"/>
    <!-- Nase/Mund würdevoll -->
    <circle cx="193" cy="102" r="1.8" fill="#1A1208"/>
    <circle cx="201" cy="103" r="1.8" fill="#1A1208"/>
    <path d="M 192 110 Q 199 113 206 110" fill="none" stroke="#1A1208" stroke-width="3" stroke-linecap="round"/>
    <!-- Würde-Brauen -->
    <path d="M 189 79 L 202 78 M 213 78 L 226 79" fill="none" stroke="#1A1208" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Banner unten -->
  <g id="banner">
    <path d="M 84 181 L 336 181 L 330 199 L 90 199 Z" fill="#FFF6E3" stroke="#1A1208" stroke-width="3"/>
    <text x="210" y="194" text-anchor="middle" font-family="Rubik,sans-serif" font-size="10" font-weight="800"
      fill="#1A1208" letter-spacing="0.5">BANANA BUCK — IN MONKEY WE TRUST</text>
  </g>

  <!-- Bananen-Dollar-Wasserzeichen rechts -->
  <g transform="translate(330 100) rotate(-10)" opacity="0.55">
    <path d="M -26 -8 C -20 12 -6 20 8 20 C 22 20 32 10 36 -10" fill="none" stroke="#5F8F49" stroke-width="13" stroke-linecap="round"/>
    <path d="M -8 -2 L -9 30 M 12 -4 L 11 28" stroke="#5F8F49" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
