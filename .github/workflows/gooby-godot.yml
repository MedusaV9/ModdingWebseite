# GOOBY-GODOT CI (W1a CORE; W4-P5 INFRA: lint || tests parallelisiert,
# Test-Report-Artefakte, Job-Timeouts).
#
# WICHTIG: Der bestehende Web-Spiel-Workflow .github/workflows/gooby-ios.yml
# triggert auf GOOBY/** und bleibt UNBERÜHRT. Dieser Workflow hier triggert
# ausschließlich auf GOOBY-GODOT/** + tools/ci/** + sich selbst.
#
# Job lint: NUR gdtoolkit via pip (braucht kein Godot-Binary) →
# gdlint/gdformat. Läuft parallel zu linux-checks statt danach — spart
# auf dem kritischen Pfad die komplette Lint-Zeit.
#
# Job linux-checks (Name bewusst stabil — needs: des ios-Skeletons zeigt
# darauf): Godot 4.4.1 (gecacht via actions/cache + tools/ci/install_godot.sh,
# Cache-Hit = kein Download) → --import (Pflicht vor Tests, der frische
# Checkout hat keinen .godot/-Import-Cache) → beide Test-Runner →
# Boot-Smoke (--quit). Alle Logs landen als Artefakt "test-reports"
# (auch bei roten Läufen, if: always()).
#
# Job ios-ipa: baut die UNSIGNIERTE .ipa (Sideload via AltStore/Sideloadly).
# Godot-Export (export_project_only) -> Xcode-Projekt -> xcodebuild ohne
# Signing -> Payload/ zippen. Artefakt: GOOBY-godot-unsigned-ipa.
name: GOOBY Godot

on:
  push:
    paths:
      - "GOOBY-GODOT/**"
      - "tools/ci/**"
      - ".github/workflows/gooby-godot.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: gdtoolkit installieren
        run: pip install "gdtoolkit==4.*"

      # xargs splittet bei vielen Dateien in mehrere Aufrufe; ohne die Pipefail-
      # Behandlung verschluckt die Shell sonst den ersten Fehler (Exit 123).
      - name: gdlint
        working-directory: GOOBY-GODOT
        run: |
          set -o pipefail
          git ls-files -z -- "*.gd" | xargs -0 --no-run-if-empty gdlint

      - name: gdformat --check
        working-directory: GOOBY-GODOT
        run: |
          set -o pipefail
          git ls-files -z -- "*.gd" | xargs -0 --no-run-if-empty gdformat --check

  linux-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Godot-Binary cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Godot ${{ env.GODOT_VERSION }} installieren
        run: bash tools/ci/install_godot.sh

      - name: Ressourcen importieren (Pflicht vor Tests)
        run: |
          set -o pipefail
          mkdir -p test-reports
          godot --headless --path GOOBY-GODOT --import 2>&1 | tee test-reports/import.log

      - name: Test-Runner
        run: |
          set -o pipefail
          godot --headless --path GOOBY-GODOT --script res://tests/run_tests.gd 2>&1 \
            | tee test-reports/run_tests.log

      - name: Unit-Tests (W1c-UI-Runner)
        run: |
          set -o pipefail
          godot --headless --path GOOBY-GODOT --script res://tests/unit/run_w1c_tests.gd 2>&1 \
            | tee test-reports/run_w1c_tests.log

      - name: Boot-Smoke (Projekt bootet headless)
        run: |
          set -o pipefail
          godot --headless --path GOOBY-GODOT --quit 2>&1 | tee test-reports/boot_smoke.log

      - name: Test-Reports hochladen (auch bei roten Läufen)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: test-reports/

  # ---------------------------------------------------------------------------
  # Unsignierte .ipa fuer Sideload (AltStore/Sideloadly) — KEINE Apple-Zertifikate.
  # Godot exportiert mit application/export_project_only=true ein Xcode-Projekt
  # (lokal auf Linux verifiziert: GOOBY.xcodeproj + GOOBY.pck + xcframeworks),
  # xcodebuild baut es ohne Signing, danach wird Payload/ zur .ipa gezippt.
  # Die App-Store-Team-ID im Preset ist ein Platzhalter — fuer unsignierte
  # Builds irrelevant, Godot verlangt das Feld aber beim Export.
  # ---------------------------------------------------------------------------
  ios-ipa:
    runs-on: macos-15
    needs: linux-checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Godot (macOS) + Export-Templates cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos-plus-templates

      - name: Godot (macOS) + Export-Templates installieren
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/godot-bin"
          APP="$BIN_DIR/Godot.app/Contents/MacOS/Godot"
          if [ ! -x "$APP" ]; then
            mkdir -p "$BIN_DIR"
            curl -fL --retry 3 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            unzip -q /tmp/godot.zip -d "$BIN_DIR"
          fi
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL_DIR/ios.zip" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$TPL_DIR"
            unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
            mv /tmp/godot-templates/templates/* "$TPL_DIR/"
          fi
          "$APP" --version

      # Godot importiert in EINEM Durchlauf nicht alles: abhaengige Ressourcen
      # (Font-Varianten, SVG-Texturen) werden erst nach dem ersten Scan bekannt.
      # Auf Fehlerzeilen zu greppen taugt NICHT als Gate — die Autoloads laufen
      # beim Start vor dem Import und melden dabei immer "have been imported".
      # Deshalb wird faktisch geprueft, ob jedes `dest_files`-Ziel existiert.
      - name: Ressourcen importieren (bis alle Ziele existieren)
        run: |
          set -uo pipefail
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          for i in 1 2 3 4; do
            echo "--- Import-Durchlauf $i ---"
            "$GODOT" --headless --path GOOBY-GODOT --import >/dev/null 2>&1 || true
            if python3 tools/ci/check_imports.py GOOBY-GODOT; then
              echo "Alle Import-Ziele vorhanden nach Durchlauf $i"
              exit 0
            fi
          done
          echo "::error::Import unvollstaendig nach 4 Durchlaeufen"
          python3 tools/ci/check_imports.py GOOBY-GODOT
          exit 1

      - name: iOS-Xcode-Projekt exportieren
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$HOME/godot-bin/Godot.app/Contents/MacOS/Godot" --headless --path GOOBY-GODOT \
            --export-release "ios" "$PWD/build/ios/GOOBY.ipa" 2>&1 | tee /tmp/export.log
          ls -la build/ios
          # Fail-closed: ein Export mit fehlenden Ressourcen laeuft sonst
          # "erfolgreich" durch und liefert eine .ipa mit leeren Texturen.
          if grep -q "have been imported" /tmp/export.log; then
            echo "::error::Export meldet nicht importierte Ressourcen"
            exit 1
          fi

      - name: xcodebuild (unsigned)
        run: |
          set -euo pipefail
          cd build/ios
          xcodebuild -project GOOBY.xcodeproj -scheme GOOBY -configuration Release \
            -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO build

      - name: .ipa packen
        run: |
          set -euo pipefail
          cd build/ios
          APP_PATH="$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GOOBY-godot-unsigned.ipa Payload
          ls -la GOOBY-godot-unsigned.ipa

      - name: .ipa forensisch verifizieren
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path, PurePosixPath
          import plistlib
          import re
          import struct
          import zipfile

          ipa = Path("build/ios/GOOBY-godot-unsigned.ipa")
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, "IPA-ZIP ist beschädigt"
              names = archive.namelist()
              assert not [
                  name for name in names
                  if name.startswith("/") or ".." in PurePosixPath(name).parts
              ], "IPA enthält unsichere Pfade"
              apps = sorted({
                  name.split("/")[1]
                  for name in names
                  if name.startswith("Payload/")
                  and len(name.split("/")) > 1
                  and name.split("/")[1].endswith(".app")
              })
              assert apps == ["GOOBY.app"], f"Unerwartete App-Bundles: {apps}"
              app = "Payload/GOOBY.app/"

              info = plistlib.loads(archive.read(app + "Info.plist"))
              assert info["CFBundleIdentifier"] == "com.permissionmaxed.gooby"
              assert info["CFBundleExecutable"] == "GOOBY"
              assert 1 in info["UIDeviceFamily"], info["UIDeviceFamily"]
              assert info["MinimumOSVersion"] == "14.0"
              assert info["ITSAppUsesNonExemptEncryption"] is False
              assert info["UIFileSharingEnabled"] is False
              assert info["UILaunchStoryboardName"] == "Launch Screen"
              assert "arm64" in info["UIRequiredDeviceCapabilities"]
              orientations = info["UISupportedInterfaceOrientations"]
              assert orientations[:2] == [
                  "UIInterfaceOrientationLandscapeLeft",
                  "UIInterfaceOrientationLandscapeRight",
              ]
              assert {
                  "UIInterfaceOrientationLandscapeLeft",
                  "UIInterfaceOrientationLandscapeRight",
                  "UIInterfaceOrientationPortrait",
                  "UIInterfaceOrientationPortraitUpsideDown",
              } == set(orientations)

              executable = archive.read(app + info["CFBundleExecutable"])
              (
                  magic,
                  cpu_type,
                  _cpu_subtype,
                  file_type,
                  command_count,
                  command_bytes,
                  flags,
                  _reserved,
              ) = struct.unpack_from("<8I", executable)
              assert magic == 0xFEEDFACF, "Executable ist kein 64-Bit-Mach-O"
              assert cpu_type == 0x0100000C, "Executable ist nicht arm64"
              assert file_type == 2, "Mach-O ist kein Executable"
              assert flags & 0x1, "Mach-O fehlt MH_NOUNDEFS"

              dylib_commands = {
                  0xC,
                  0x80000018,
                  0x8000001F,
                  0x20,
                  0x80000023,
              }
              non_system_dylibs = []
              has_code_signature = False
              offset = 32
              for _ in range(command_count):
                  command, command_size = struct.unpack_from("<II", executable, offset)
                  assert command_size >= 8
                  if command in dylib_commands:
                      name_offset = struct.unpack_from("<I", executable, offset + 8)[0]
                      end = executable.find(b"\0", offset + name_offset, offset + command_size)
                      dylib = executable[offset + name_offset:end].decode()
                      if not (
                          dylib.startswith("/System/Library/")
                          or dylib.startswith("/usr/lib/")
                      ):
                          non_system_dylibs.append(dylib)
                  if command == 0x1D:
                      has_code_signature = True
                  offset += command_size
              assert offset == 32 + command_bytes
              assert not non_system_dylibs, non_system_dylibs
              assert not has_code_signature, "Artefakt soll vor dem Sideload unsigniert sein"

              assert archive.read(app + "PkgInfo") == b"APPL????"
              assert any(
                  name.startswith(app + "Launch Screen.storyboardc/")
                  for name in names
              )
              assert app + "Assets.car" in names
              assets_car = archive.read(app + "Assets.car")
              assert b"AppIcon" in assets_car and b"Icon-1024.png" in assets_car
              assert app + "AppIcon60x60@2x.png" in names
              assert app + "AppIcon76x76@2x~ipad.png" in names
              assert not any("/_CodeSignature/" in name for name in names)
              assert not any(name.endswith("embedded.mobileprovision") for name in names)

              pck = archive.read(app + "GOOBY.pck")
              assert pck[:4] == b"GDPC", "GOOBY.pck hat keinen Godot-PCK-Header"
              file_base = struct.unpack_from("<Q", pck, 24)[0]
              directory_offset = 96
              file_count = struct.unpack_from("<I", pck, directory_offset)[0]
              directory_offset += 4
              entries = {}
              for _ in range(file_count):
                  path_length = struct.unpack_from("<I", pck, directory_offset)[0]
                  directory_offset += 4
                  path = pck[
                      directory_offset:directory_offset + path_length
                  ].rstrip(b"\0").decode()
                  directory_offset += path_length
                  data_offset, data_size = struct.unpack_from(
                      "<QQ", pck, directory_offset
                  )
                  directory_offset += 16
                  directory_offset += 16  # MD5
                  entry_flags = struct.unpack_from("<I", pck, directory_offset)[0]
                  directory_offset += 4
                  entries[path] = (file_base + data_offset, data_size, entry_flags)
              assert file_count > 1000, f"Verdächtig kleines PCK: {file_count} Dateien"

              project = Path("GOOBY-GODOT")
              imported_assets = []
              direct_json = []
              for root_name in ("assets", "content"):
                  for source in (project / root_name).rglob("*"):
                      if not source.is_file() or source.name.endswith(".import"):
                          continue
                      relative = source.relative_to(project).as_posix()
                      if Path(str(source) + ".import").is_file():
                          imported_assets.append(relative)
                      elif source.suffix.lower() == ".json":
                          direct_json.append(relative)

              for source in imported_assets:
                  import_path = source + ".import"
                  assert import_path in entries, f"Asset-Metadaten fehlen: {source}"
                  data_offset, data_size, _flags = entries[import_path]
                  metadata = pck[data_offset:data_offset + data_size].decode(
                      errors="replace"
                  )
                  match = re.search(r'(?m)^path="res://([^"]+)"', metadata)
                  assert match, f"Asset ohne Export-Remap: {source}"
                  assert match.group(1) in entries, f"Asset-Daten fehlen: {source}"
              for source in direct_json:
                  assert source in entries, f"JSON fehlt im PCK: {source}"

          print(
              "IPA PASS:",
              f"{ipa.stat().st_size} Bytes,",
              f"{file_count} PCK-Dateien,",
              f"{len(imported_assets)}/{len(imported_assets)} Assets,",
              f"{len(direct_json)}/{len(direct_json)} JSON-Dateien",
          )
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: GOOBY-godot-unsigned-ipa
          path: build/ios/GOOBY-godot-unsigned.ipa
