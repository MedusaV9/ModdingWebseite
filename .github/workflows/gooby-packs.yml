# GOOBY Pack-Build & -Release (W2b UPDATES; Doc B §5.1).
#
# Baut die Daten-Packs (GOOBY-GODOT/content/<id>/ → .pck via
# `godot --headless --export-pack`, config als plain JSON), erzeugt
# manifest.json und hängt alles an den rollenden Release-Tag `updates`.
#
# EHRLICHER STAND (Doc B §3, Entscheidung A): Das öffentliche Content-Repo
# `MedusaV9/gooby-updates` existiert noch NICHT (User-Action; Backlog B §5/M2).
# Bis dahin released dieser Workflow ins HAUPT-Repo — tokenlos funktioniert
# der Download dann nur, solange das Haupt-Repo öffentlich ist. Umzug aufs
# public Content-Repo (3 Zeilen, s. docs/UPDATES.md §6):
#   1. Repo `gooby-updates` anlegen (leerer main + README genügt).
#   2. Fine-grained PAT (nur dieses Repo, nur contents:write) als Secret
#      GH_CONTENT_TOKEN hinterlegen.
#   3. Im Release-Step unten `repository:` + `token:` einkommentieren und
#      RELEASE_BASE_URL auf das public Repo stellen.
name: gooby-packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Pack-Id (core/balance/events/cosmetics/stickers/codes/config) oder 'all'"
        required: false
        default: "all"
      publish:
        description: "Release-Assets am Tag 'updates' veröffentlichen?"
        type: boolean
        required: false
        default: false
  # Bewusst KEIN push-Trigger, solange das Release-Ziel das Haupt-Repo ist —
  # sonst überschreibt jeder main-Push den Live-Manifest-Stand (Doc B §5.1
  # sieht push+paths erst mit dem public Content-Repo vor).

concurrency: manifest-update # verhindert Races zweier paralleler Pack-Builds

permissions:
  contents: write

jobs:
  build-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot 4.4.1 cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-bin
          key: godot-4.4.1-linux-x86_64

      - name: Godot installieren
        run: bash tools/ci/install_godot.sh

      - name: Packs bauen + verifizieren + manifest.json
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          RELEASE_TAG_MODE: single
        run: tools/packs/build_packs.sh "${{ github.event.inputs.packs || 'all' }}"

      - name: Artefakte hochladen (Build-Nachweis, auch ohne Release)
        uses: actions/upload-artifact@v4
        with:
          name: gooby-packs
          path: |
            GOOBY-GODOT/build/packs/*.pck
            GOOBY-GODOT/build/packs/config.json
            GOOBY-GODOT/build/packs/manifest.json

      - name: Release 'updates' aktualisieren (rollender Tag, Doc B §1.3)
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updates
          name: "GOOBY Updates (rollend)"
          body: "Rollender Update-Release: manifest.json + aktuelle Packs. Details: docs/UPDATES.md"
          prerelease: false
          files: |
            GOOBY-GODOT/build/packs/*.pck
            GOOBY-GODOT/build/packs/config.json
            GOOBY-GODOT/build/packs/manifest.json
          # --- Zielbild public Content-Repo (einkommentieren, sobald es existiert):
          # repository: MedusaV9/gooby-updates
          # token: ${{ secrets.GH_CONTENT_TOKEN }}
